extends:
  - recommended
rules:
  no-unused-components: off
  operation-4xx-response: off
  info-license-strict: off
  # Routes of different apps share one namespace in this contract, and Astro resolves static
  # segments before params (for example web /api/forms/uploads/{id} vs admin /api/forms/{id}/publish).
  no-ambiguous-paths: off
