name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Uses the exact pnpm version pinned in package.json "packageManager".
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Browser for the Playwright smoke suite (tests/e2e) run by pnpm check.
      - run: pnpm exec playwright install --with-deps chromium
      # typecheck (incl. .astro), lint, format check, unit/integration tests,
      # build of all six apps, browser tests against the production builds.
      - run: pnpm check
