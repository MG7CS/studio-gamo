name: API contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - run: corepack enable
      - run: corepack prepare pnpm@11.6.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: make api-docs
      - run: make api-check
      - name: Compatibility review against event base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            pnpm api:compatibility "$BASE_SHA"
          fi
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
