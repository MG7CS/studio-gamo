# Gamo Admin (rebuilt from scratch; docs/ADMIN_REQUIREMENTS.md). Until cutover this config has NO production
# environment, so `wrangler deploy --env production` cannot overwrite the live `gamo-admin` worker.
name = "gamo-admin-next"
account_id = "ebae7bded6ab45950aeba1d6cf51eb7f"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Local development environment (isolated local Miniflare/workerd SQLite & R2)
[vars]
ENVIRONMENT = "local"
ALLOW_DEMO_SESSION = "false"
PUBLIC_ROOT_DOMAIN = "localhost"
PUBLIC_SITE_URL_WEB = "http://127.0.0.1:4321"
PUBLIC_SITE_URL_WORSHIP = "http://127.0.0.1:4322"
PUBLIC_SITE_URL_ACADEMY = "http://127.0.0.1:4323"
PUBLIC_SITE_URL_LIVE = "http://127.0.0.1:4324"
PUBLIC_SITE_URL_PRODUCTION = "http://127.0.0.1:4325"
PUBLIC_SITE_URL_ADMIN = "http://127.0.0.1:4326"

[[d1_databases]]
binding = "DB"
database_name = "gamo-db-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "../../packages/db/migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "gamo-media-local"

[[kv_namespaces]]
binding = "SESSION"
id = "7d35f3e994d04c00a8a404a552978674"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "7d35f3e994d04c00a8a404a552978674"

# Preview environment: behind Cloudflare Access, workers.dev disabled. Same worker and bindings as the
# current admin preview, so a preview deploy from this directory replaces the old preview build.
[env.preview]
name = "gamo-admin-preview"
workers_dev = false
[env.preview.vars]
ENVIRONMENT = "preview"
ALLOW_DEMO_SESSION = "false"
PUBLIC_ROOT_DOMAIN = "gamostudio.org"
PUBLIC_SITE_URL_WEB = "https://gamo-web-preview.gamostudio.workers.dev"
PUBLIC_SITE_URL_WORSHIP = "https://gamo-worship-preview.gamostudio.workers.dev"
PUBLIC_SITE_URL_ACADEMY = "https://gamo-academy-preview.gamostudio.workers.dev"
PUBLIC_SITE_URL_LIVE = "https://gamo-live-preview.gamostudio.workers.dev"
PUBLIC_SITE_URL_PRODUCTION = "https://gamo-production-preview.gamostudio.workers.dev"
PUBLIC_SITE_URL_ADMIN = "https://admin-preview.gamostudio.org"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "gamo-db-preview"
database_id = "d7e12797-cc6c-4fa3-91c7-c192863e4812"
migrations_dir = "../../packages/db/migrations"

[[env.preview.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "gamo-media-preview"

[[env.preview.kv_namespaces]]
binding = "SESSION"
id = "7d35f3e994d04c00a8a404a552978674"

[[env.preview.kv_namespaces]]
binding = "SESSION_KV"
id = "7d35f3e994d04c00a8a404a552978674"
