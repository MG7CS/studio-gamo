name = "gamo-web"
# Custom entry: Astro `fetch` + the daily cron `scheduled` handler (src/worker.ts; why: header comment there).
main = "src/worker.ts"
account_id = "ebae7bded6ab45950aeba1d6cf51eb7f"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Local development environment (isolated local Miniflare/workerd SQLite & R2)
[vars]
ENVIRONMENT = "local"
PUBLIC_ROOT_DOMAIN = "localhost"
PUBLIC_SITE_URL_WEB = "http://127.0.0.1:4321"
PUBLIC_SITE_URL_WORSHIP = "http://127.0.0.1:4322"
PUBLIC_SITE_URL_ACADEMY = "http://127.0.0.1:4323"
PUBLIC_SITE_URL_PRODUCTION = "http://127.0.0.1:4325"
PUBLIC_SITE_URL_ADMIN = "http://127.0.0.1:4326"

[[d1_databases]]
binding = "DB"
database_name = "gamo-db-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "../../packages/db/migrations"

# MEDIA_BUCKET holds form uploads (R2 multipart; lifecycle rules: docs/RUNBOOK.md §3b). The IMAGES binding
# (Cloudflare Images, re-encodes uploaded photos) needs no entry here: @astrojs/cloudflare adds `images = { binding = "IMAGES" }`
# to the generated config for every environment.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "gamo-media-local"

[[kv_namespaces]]
binding = "SESSION"
id = "7d35f3e994d04c00a8a404a552978674"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "7d35f3e994d04c00a8a404a552978674"

# Preview environment (isolated preview D1 & R2 in account gamostudios)
[env.preview]
name = "gamo-web-preview"
workers_dev = true
[env.preview.vars]
ENVIRONMENT = "preview"
PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAFa4P6c3vDrYW8Qo"
PUBLIC_ROOT_DOMAIN = "gamostudio.workers.dev"
PUBLIC_SITE_URL_WEB = "https://gamo-web-preview.gamostudio.workers.dev"
PUBLIC_SITE_URL_WORSHIP = "https://gamo-worship-preview.gamostudio.workers.dev"
PUBLIC_SITE_URL_ACADEMY = "https://gamo-academy-preview.gamostudio.workers.dev"
PUBLIC_SITE_URL_PRODUCTION = "https://gamo-production-preview.gamostudio.workers.dev"
PUBLIC_SITE_URL_ADMIN = "https://admin-preview.gamostudio.org"

# Daily job (email retry + retention, 06:00 UTC): handler in src/worker.ts, jobs in packages/domain/src/jobs/daily.ts,
# schedule and checks in docs/RUNBOOK.md §3b. Web only.
[env.preview.triggers]
crons = ["0 6 * * *"]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "gamo-db-preview"
database_id = "d7e12797-cc6c-4fa3-91c7-c192863e4812"
migrations_dir = "../../packages/db/migrations"

[[env.preview.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "gamo-media-preview"

[[env.preview.kv_namespaces]]
binding = "SESSION"
id = "7d35f3e994d04c00a8a404a552978674"

[[env.preview.kv_namespaces]]
binding = "SESSION_KV"
id = "7d35f3e994d04c00a8a404a552978674"

# Production environment for canonical domain gamostudio.org
[env.production]
name = "gamo-web"
routes = [
  { pattern = "gamostudio.org", custom_domain = true },
  { pattern = "www.gamostudio.org", custom_domain = true }
]
[env.production.vars]
ENVIRONMENT = "production"
PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAFa5Jse4TTbIFvR9"
PUBLIC_ROOT_DOMAIN = "gamostudio.org"
PUBLIC_SITE_URL_WEB = "https://gamostudio.org"
PUBLIC_SITE_URL_WORSHIP = "https://worship.gamostudio.org"
PUBLIC_SITE_URL_ACADEMY = "https://academy.gamostudio.org"
PUBLIC_SITE_URL_PRODUCTION = "https://production.gamostudio.org"
PUBLIC_SITE_URL_ADMIN = "https://admin.gamostudio.org"

# Daily job (email retry + retention, 06:00 UTC): handler in src/worker.ts, jobs in packages/domain/src/jobs/daily.ts,
# schedule and checks in docs/RUNBOOK.md §3b. Web only.
[env.production.triggers]
crons = ["0 6 * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "gamo-db-production"
database_id = "d6db9fe7-77c0-4a50-836e-3d1924f00b53"
migrations_dir = "../../packages/db/migrations"

[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "gamo-media-production"

[[env.production.kv_namespaces]]
binding = "SESSION"
id = "51491fce0ca740318d81ab45ef119940"

[[env.production.kv_namespaces]]
binding = "SESSION_KV"
id = "51491fce0ca740318d81ab45ef119940"
