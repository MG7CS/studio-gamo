packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  browser-tabs-lock: false
  core-js: false
  esbuild: true
  workerd: true

# openapi-typescript uses the compiler API removed from TypeScript 7.
overrides:
  'openapi-typescript>typescript': '5.9.3'
  '@esbuild-kit/core-utils>esbuild': '0.28.2'
