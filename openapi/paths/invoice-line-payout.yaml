servers:
  - url: http://127.0.0.1:4326
    description: Local admin application
post:
  operationId: recordInvoiceLinePayout
  tags:
    - Invoicing
  summary: Record the musician payout for a line
  description: Records that the musician_pay line was paid out by Gamo (method and reference). The
    amount is the line amount, never reduced by an administrative allocation. Refused with 409 for
    non-musician lines, unpaid invoices or an already recorded payout.
  security:
    - BrowserSession: []
  x-application: admin
  x-status: planned
  x-authorization: Staff session (BrowserSession) behind the Admin Access boundary; same-origin check
    (requireSameOrigin) on every state-changing request; any staff role (role scoping is audit
    finding, not yet enforced).
  x-idempotency: 'At most one payout per line: a second call returns 409 and records nothing.'
  x-source: apps/admin/src/pages/api/invoice-lines/[id]/payout.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema: &a1
          $ref: ../components/schemas/invoices/RecordPayoutInput.yaml
      application/x-www-form-urlencoded:
        schema: *a1
  responses:
    '200':
      description: Recorded.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/invoices/RecordPayoutResponse.yaml
    '303':
      $ref: ../components/responses/SeeOther.yaml
    '400': &a2
      $ref: ../components/responses/LegacyError.yaml
    '401':
      $ref: ../components/responses/StaffUnauthorized.yaml
    '403': *a2
    '404': *a2
    '409': *a2
    '500': *a2
  x-internal: true
