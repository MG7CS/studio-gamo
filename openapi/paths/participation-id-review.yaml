servers:
  - url: http://127.0.0.1:4326
    description: Local application
post:
  operationId: reviewParticipation
  tags:
    - Administration
  summary: review Participation
  description: Persisted participation inquiry workflow. Identity verification is
    required; participation submission does not approve eligibility.
  security:
    - CloudflareAccess: []
      BrowserSession: []
  x-application: admin
  x-status: implemented
  x-authorization: Staff boundary plus staff session.
  x-idempotency: Unsupported; client keys ignored.
  x-source: apps/admin/src/pages/api/participation/[id]/review.ts
  x-internal: true
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    '200':
      description: Successful persisted response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/participation/ParticipationResponse.yaml
    '400': &a1
      $ref: ../components/responses/LegacyError.yaml
    '401': *a1
    '403': *a1
    '404': *a1
    '409': *a1
    '500': *a1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/participation/ParticipationReviewInput.yaml
