servers:
  - url: http://127.0.0.1:4324
    description: Local live application
get:
  operationId: listEventProductionRequests
  tags:
    - Production
  summary: List production requests linked to an event
  description: Returns permission-scoped production service records for the event
    without exposing financial settlements or attendee personal data.
  security:
    - BrowserSession: []
  x-application: live
  x-status: implemented
  x-authorization: Verified session with coordinate_production or edit_content
    permission on the event.
  x-idempotency: Read-only
  x-source: apps/live/src/pages/api/events/[id]/production-requests.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    "200":
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/live/EventProductionRequestListResponse.yaml
    "401":
      $ref: ../components/responses/LegacyError.yaml
    "403":
      $ref: ../components/responses/LegacyError.yaml
    "404":
      $ref: ../components/responses/LegacyError.yaml
    "500":
      $ref: ../components/responses/LegacyError.yaml
post:
  operationId: createEventProductionRequest
  tags:
    - Production
  summary: Request Gamo Production support for an event
  description: Creates a linked Gamo Production request directly from the event
    context without duplicating event identity or requiring unrelated logins.
  security:
    - BrowserSession: []
  x-application: live
  x-status: implemented
  x-authorization: Verified session with coordinate_production permission on the
    event.
  x-idempotency: Creates linked production request.
  x-source: apps/live/src/pages/api/events/[id]/production-requests.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    "201":
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/live/EventProductionRequestResponse.yaml
    "400":
      $ref: ../components/responses/LegacyError.yaml
    "401":
      $ref: ../components/responses/LegacyError.yaml
    "403":
      $ref: ../components/responses/LegacyError.yaml
    "404":
      $ref: ../components/responses/LegacyError.yaml
    "500":
      $ref: ../components/responses/LegacyError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/live/CreateEventProductionRequestInput.yaml
