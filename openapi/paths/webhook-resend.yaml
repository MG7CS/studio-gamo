servers:
  - url: http://127.0.0.1:4321
    description: Local global site (web)
post:
  operationId: receiveResendWebhook
  tags:
    - Email
  summary: Receive a signed Resend event
  description: >-
    Svix signature with RESEND_WEBHOOK_SECRET (503 without it). Updates the email_log status for every
    program's mail; hard bounces and complaints add the address hash to email_suppressions.
  security: []
  x-application: web
  x-status: implemented
  x-authorization: Public (Svix signature).
  x-idempotency: Statuses never move backwards; repeated events change nothing.
  x-source: apps/web/src/pages/api/webhook/resend.ts
  parameters: []
  responses:
    '200':
      description: Event received; `applied` says whether it changed a stored delivery status.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/email/ResendWebhookResponse.yaml
    '400':
      $ref: ../components/responses/LegacyError.yaml
    '503':
      $ref: ../components/responses/LegacyError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/email/ResendEvent.yaml
