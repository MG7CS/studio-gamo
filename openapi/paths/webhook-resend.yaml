servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: receiveResendWebhook
  tags:
    - Payments
  summary: Receive a signed Resend event
  description: >-
    Svix signature with RESEND_WEBHOOK_SECRET (503 without it). Updates the email_log status; hard bounces and complaints add the address hash to email_suppressions.
  security: []
  x-application: live
  x-status: implemented
  x-authorization: Public (Svix signature).
  x-idempotency: Statuses never move backwards; repeated events change nothing.
  x-source: apps/live/src/pages/api/webhook/resend.ts
  parameters: []
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ticketing/ResendWebhookResponse.yaml
    '400':
      $ref: ../components/responses/TicketingError.yaml
    '503':
      $ref: ../components/responses/TicketingError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ticketing/ResendEvent.yaml
