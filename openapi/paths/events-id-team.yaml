servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: assignEventTeamMember
  tags:
    - Live
  summary: Assign role-scoped event team member
  description: Grants or updates granular per-event permissions. Content/publishing
    roles cannot grant refund approval or settlement access unless the actor is
    primary organization owner or superadmin.
  security:
    - BrowserSession: []
  x-application: live
  x-status: implemented
  x-authorization: Verified session with event owner/admin or edit_content permission.
  x-idempotency: Upserts on (eventId, userId, role).
  x-source: apps/live/src/pages/api/events/[id]/team.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    '201':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/live/AssignEventTeamResponse.yaml
    '400':
      $ref: ../components/responses/LegacyError.yaml
    '401':
      $ref: ../components/responses/LegacyError.yaml
    '403':
      $ref: ../components/responses/LegacyError.yaml
    '404':
      $ref: ../components/responses/LegacyError.yaml
    '500':
      $ref: ../components/responses/LegacyError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/live/AssignEventTeamInput.yaml
