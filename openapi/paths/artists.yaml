servers:
  - url: http://127.0.0.1:4324
    description: Local live application
get:
  operationId: listArtists
  tags:
    - Live
  summary: List verified live performance artists
  description: Lists verified artist profiles for concert and event discovery.
  security: []
  x-application: live
  x-status: implemented
  x-authorization: Public
  x-idempotency: Read-only
  x-source: apps/live/src/pages/api/artists/index.ts
  parameters: []
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/live/ArtistListResponse.yaml
    '500':
      $ref: ../components/responses/LegacyError.yaml
post:
  operationId: createArtistProfile
  tags:
    - Live
  summary: Create or onboard artist profile
  description: Creates a live performance artist profile for the authenticated
    user without coupling Gamo Worship rankings.
  security:
    - BrowserSession: []
  x-application: live
  x-status: implemented
  x-authorization: Verified user session.
  x-idempotency: One artist profile per user/slug.
  x-source: apps/live/src/pages/api/artists/index.ts
  parameters: []
  responses:
    '201':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/live/ArtistProfileResponse.yaml
    '400':
      $ref: ../components/responses/LegacyError.yaml
    '401':
      $ref: ../components/responses/LegacyError.yaml
    '403':
      $ref: ../components/responses/LegacyError.yaml
    '409':
      $ref: ../components/responses/LegacyError.yaml
    '500':
      $ref: ../components/responses/LegacyError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/live/CreateArtistInput.yaml
