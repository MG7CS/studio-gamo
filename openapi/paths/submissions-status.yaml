servers:
  - url: http://127.0.0.1:4326
    description: Local admin application
post:
  operationId: setSubmissionStatus
  tags:
    - Forms
  summary: Set a submission status
  description: Moves a submission between new, in_review and closed and records optional staff notes.
    Approve and decline are separate actions.
  security:
    - BrowserSession: []
  x-application: admin
  x-status: planned
  x-authorization: Staff session (BrowserSession) behind the Admin Access boundary; same-origin check
    (requireSameOrigin) on every state-changing request; any staff role (role scoping is audit
    finding, not yet enforced).
  x-idempotency: Setting the same status again is a no-op.
  x-source: apps/admin/src/pages/api/submissions/[id]/status.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema: &a1
          $ref: ../components/schemas/forms/SubmissionStatusInput.yaml
      application/x-www-form-urlencoded:
        schema: *a1
  responses:
    '200':
      description: Updated.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/forms/SubmissionStatusResponse.yaml
    '303':
      $ref: ../components/responses/SeeOther.yaml
    '400': &a2
      $ref: ../components/responses/LegacyError.yaml
    '401':
      $ref: ../components/responses/StaffUnauthorized.yaml
    '403': *a2
    '404': *a2
    '500': *a2
  x-internal: true
