servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: lookupVerifiedTickets
  tags:
    - Live
  summary: Self-service verified ticket and order lookup
  description: Returns attendee registrations, orders, receipts, and QR passes only
    after verifying a 6-digit email challenge code. Knowing an email address alone
    is insufficient.
  security: []
  x-application: live
  x-status: implemented
  x-authorization: Public with mandatory verified email challenge code.
  x-idempotency: One-time challenge code consumption.
  x-source: apps/live/src/pages/api/tickets/lookup.ts
  parameters: []
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/live/TicketLookupResponse.yaml
    '400':
      $ref: ../components/responses/LegacyError.yaml
    '403':
      $ref: ../components/responses/LegacyError.yaml
    '401':
      $ref: ../components/responses/LegacyError.yaml
    '500':
      $ref: ../components/responses/LegacyError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/live/TicketLookupInput.yaml
