servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: lookupTicketRecords
  tags:
    - Live
  summary: Email a link to my tickets
  description: >-
    Always answers the same. When the address has tickets it receives a customer:all link (30 minutes) that opens the same tickets; recovery never issues new ones. Every lookup that finds an order is logged in ticket_access_log.
  security: []
  x-application: live
  x-status: implemented
  x-authorization: Public (Turnstile and rate limits).
  x-idempotency: Not needed; repeated requests are rate limited.
  x-source: apps/live/src/pages/api/tickets/lookup.ts
  parameters: []
  responses:
    '202':
      description: Same answer for every address
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ticketing/AcceptedMessage.yaml
    '400':
      $ref: ../components/responses/TicketingError.yaml
    '403':
      $ref: ../components/responses/TicketingError.yaml
    '413':
      $ref: ../components/responses/TicketingError.yaml
    '415':
      $ref: ../components/responses/TicketingError.yaml
    '429':
      $ref: ../components/responses/TicketingError.yaml
    '503':
      $ref: ../components/responses/TicketingError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ticketing/RecoveryInput.yaml
      application/x-www-form-urlencoded:
        schema:
          type: object
          additionalProperties: true
          description: The same fields from the server-rendered form (quantities as qty.<categoryId>[.<sectionId>]).
