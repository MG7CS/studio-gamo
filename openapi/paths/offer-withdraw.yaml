servers:
  - url: http://127.0.0.1:4326
    description: Local admin application
post:
  operationId: withdrawOffer
  tags:
    - Roster and requests
  summary: Withdraw a pending offer
  description: Revokes the link; the musician then sees no longer available. 409 when the offer was
    already answered.
  security:
    - BrowserSession: []
  x-application: admin
  x-status: planned
  x-authorization: Staff session (BrowserSession) behind the Admin Access boundary; same-origin check
    (requireSameOrigin) on every state-changing request; any staff role (role scoping is audit
    finding, not yet enforced).
  x-idempotency: Withdrawing an already withdrawn offer returns 200 unchanged.
  x-source: apps/admin/src/pages/api/offers/[id]/withdraw.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    '200':
      description: Withdrawn.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/roster/WithdrawOfferResponse.yaml
    '303':
      $ref: ../components/responses/SeeOther.yaml
    '400': &a1
      $ref: ../components/responses/LegacyError.yaml
    '401':
      $ref: ../components/responses/StaffUnauthorized.yaml
    '403': *a1
    '404': *a1
    '409': *a1
    '500': *a1
  x-internal: true
