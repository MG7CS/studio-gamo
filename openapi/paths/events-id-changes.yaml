servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: changeEvent
  tags:
    - Live
  summary: Cancel, reschedule or move an event
  description: >-
    cancelled (manage_ticketing and approve_refunds) voids every ticket, refunds paid orders in full (test mode) and emails everyone. rescheduled and venue_changed (edit_content) keep tickets valid and email everyone an updated .ics (same UID, higher SEQUENCE).
  security:
    - BrowserSession: []
  x-application: live
  x-status: implemented
  x-authorization: Verified session with the permissions above.
  x-idempotency: Notifications are keyed per change, order and address.
  x-source: apps/live/src/pages/api/events/[id]/changes.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ticketing/EventChangeResponse.yaml
    '400':
      $ref: ../components/responses/TicketingError.yaml
    '401':
      $ref: ../components/responses/TicketingError.yaml
    '403':
      $ref: ../components/responses/TicketingError.yaml
    '404':
      $ref: ../components/responses/TicketingError.yaml
    '409':
      $ref: ../components/responses/TicketingError.yaml
    '503':
      $ref: ../components/responses/TicketingError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ticketing/EventChangeInput.yaml
