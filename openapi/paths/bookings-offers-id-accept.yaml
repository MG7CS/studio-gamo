servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: acceptBookingOffer
  tags:
    - Live
  summary: Confirm booking offer and create engagement
  description: Authorized counterparty accepts a proposed offer, locking terms as
    immutable and creating a confirmed performance engagement with deposits
    disabled pending policy approval.
  security:
    - BrowserSession: []
  x-application: live
  x-status: implemented
  x-authorization: Authorized counterparty (artist/representative for organizer
    offers, or organizer negotiator for artist/representative counteroffers).
  x-idempotency: Rejects duplicate acceptance with 409.
  x-source: apps/live/src/pages/api/bookings/offers/[id]/accept.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    "200":
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/live/BookingAcceptResponse.yaml
    "400":
      $ref: ../components/responses/LegacyError.yaml
    "401":
      $ref: ../components/responses/LegacyError.yaml
    "403":
      $ref: ../components/responses/LegacyError.yaml
    "404":
      $ref: ../components/responses/LegacyError.yaml
    "409":
      $ref: ../components/responses/LegacyError.yaml
    "500":
      $ref: ../components/responses/LegacyError.yaml
