servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: syncOfflineScans
  tags:
    - Live
  summary: 'Replay a device’s offline scan queue'
  description: 'Replays up to 200 queued scans in device-time order through the same statements as online scanning. Scans that lost to an earlier admission are flagged duplicate_offline and counted in needsReview. Scanner devices only.'
  security:
    - ScannerDevice: []
  x-application: live
  x-status: implemented
  x-authorization: 'Scanner device cookie for this event. Same-origin required.'
  x-idempotency: 'Each clientScanId is recorded once; a retried sync records nothing new.'
  x-source: apps/live/src/pages/api/scanner/sync.ts
  parameters: []
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/live/scanner/ScannerSyncResponse.yaml
    '400':
      $ref: ../components/responses/LegacyError.yaml
    '401':
      $ref: ../components/responses/LegacyError.yaml
    '403':
      $ref: ../components/responses/LegacyError.yaml
    '404':
      $ref: ../components/responses/LegacyError.yaml
    '429':
      $ref: ../components/responses/LegacyError.yaml
    '503':
      $ref: ../components/responses/LegacyError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/live/scanner/ScannerSyncInput.yaml
