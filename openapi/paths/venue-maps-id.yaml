servers:
  - url: http://127.0.0.1:4324
    description: Local live application
get:
  operationId: getVenueMapImage
  tags:
    - Live
  summary: Venue blueprint image
  description: Serves an uploaded blueprint (PNG, JPEG, WebP or sanitised SVG) as an image with
    X-Content-Type-Options nosniff and Content-Security-Policy sandbox; never inlined into pages.
    Archived blueprints are not served. Cacheable by content hash (the v query parameter).
  security: []
  x-application: live
  x-status: implemented
  x-authorization: Public (blueprint ids are random; only non-archived blueprints are served).
  x-idempotency: Safe.
  x-source: apps/live/src/pages/api/venue-maps/[id].ts
  parameters:
    - name: id
      in: path
      required: true
      description: Venue blueprint identifier (vmap_…).
      schema:
        type: string
        minLength: 1
        maxLength: 64
    - name: v
      in: query
      required: false
      description: Content hash prefix (cache key only).
      schema:
        type: string
        maxLength: 64
  responses:
    '200':
      description: The blueprint image.
      content:
        image/png:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
        image/webp:
          schema:
            type: string
            format: binary
        image/svg+xml:
          schema:
            type: string
    '304':
      description: Not modified.
    '404':
      $ref: ../components/responses/LegacyError.yaml
    '503':
      $ref: ../components/responses/LegacyError.yaml
