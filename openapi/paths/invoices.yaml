servers:
  - url: http://127.0.0.1:4326
    description: Local admin application
get:
  operationId: listInvoices
  tags:
    - Invoicing
  summary: List invoices
  description: Newest first, by createdAt then id. Filter by status; keyset paging.
  security:
    - BrowserSession: []
  x-application: admin
  x-status: planned
  x-authorization: Staff session (BrowserSession) behind the Admin Access boundary; same-origin check
    (requireSameOrigin) on every state-changing request; any staff role (role scoping is audit
    finding, not yet enforced).
  x-source: apps/admin/src/pages/api/invoices/index.ts
  parameters:
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - draft
          - open
          - paid
          - void
    - $ref: ../components/parameters/limit.yaml
    - $ref: ../components/parameters/cursor.yaml
  responses:
    '200':
      description: Invoices.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/invoices/InvoiceListResponse.yaml
    '400': &a1
      $ref: ../components/responses/LegacyError.yaml
    '401':
      $ref: ../components/responses/StaffUnauthorized.yaml
    '403': *a1
    '500': *a1
  x-internal: true
post:
  operationId: createInvoice
  tags:
    - Invoicing
  summary: Create a draft invoice
  description: Creates a draft with number GS-YYYY-NNNN (sequential per year), integer-cent USD lines
    and a computed total. For a service_request source with no lines, lines are prefilled from
    accepted offers. A gamo_admin line is refused with 400 gamo_admin_not_approved unless
    GAMO_ADMIN_FEE_APPROVED=true.
  security:
    - BrowserSession: []
  x-application: admin
  x-status: planned
  x-authorization: Staff session (BrowserSession) behind the Admin Access boundary; same-origin check
    (requireSameOrigin) on every state-changing request; any staff role (role scoping is audit
    finding, not yet enforced).
  x-source: apps/admin/src/pages/api/invoices/index.ts
  parameters: []
  requestBody:
    required: true
    content:
      application/json:
        schema: &a2
          $ref: ../components/schemas/invoices/CreateInvoiceInput.yaml
      application/x-www-form-urlencoded:
        schema: *a2
  responses:
    '200':
      description: Created.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/invoices/InvoiceResponse.yaml
    '303':
      $ref: ../components/responses/SeeOther.yaml
    '400': *a1
    '401':
      $ref: ../components/responses/StaffUnauthorized.yaml
    '403': *a1
    '404': *a1
    '500': *a1
  x-internal: true
