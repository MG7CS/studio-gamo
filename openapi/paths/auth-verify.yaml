servers:
  - url: http://127.0.0.1:4321
    description: Local web application
post:
  operationId: verifyAuthChallenge
  tags:
    - Identity and Accounts
  summary: Verify email challenge code and establish authenticated session
  description: Verifies the 6-digit challenge code against D1 auth_challenges,
    enforces expiry and attempt lockout, sets users.verified_email_at, revokes
    any presented prior session cookie, and issues a new host-only HttpOnly
    __session cookie.
  security: []
  x-application: web
  x-replicated-applications: [live, worship, academy, production]
  x-status: implemented
  x-authorization: Public (same-origin enforced; valid unconsumed challenge code required)
  x-idempotency: Single-use challenge code; replay after consumption returns 401.
  x-source: apps/web/src/pages/api/auth/verify.ts
  parameters: []
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/identity/SessionResponse.yaml
    '400':
      $ref: ../components/responses/LegacyError.yaml
    '401':
      $ref: ../components/responses/LegacyError.yaml
    '403':
      $ref: ../components/responses/LegacyError.yaml
    '413':
      $ref: ../components/responses/LegacyError.yaml
    '415':
      $ref: ../components/responses/LegacyError.yaml
    '429':
      $ref: ../components/responses/LegacyError.yaml
    '503':
      $ref: ../components/responses/LegacyError.yaml
    '500':
      $ref: ../components/responses/LegacyError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/identity/AuthVerifyInput.yaml
