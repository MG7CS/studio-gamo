servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: revokeRepresentation
  tags:
    - Live
  summary: Revoke artist representation authorization
  description: Revokes an active representation authorization, blocking future
    booking/negotiation/financial access while preserving existing confirmed
    engagements and audit history.
  security:
    - BrowserSession: []
  x-application: live
  x-status: implemented
  x-authorization: Verified artist owner, representative owner, or superadmin.
  x-idempotency: Idempotent revocation.
  x-source: apps/live/src/pages/api/representations/[id]/revoke.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/live/RepresentationResponse.yaml
    '400':
      $ref: ../components/responses/LegacyError.yaml
    '401':
      $ref: ../components/responses/LegacyError.yaml
    '403':
      $ref: ../components/responses/LegacyError.yaml
    '404':
      $ref: ../components/responses/LegacyError.yaml
    '500':
      $ref: ../components/responses/LegacyError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/live/RevokeRepresentationInput.yaml
