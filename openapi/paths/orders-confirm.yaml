servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: confirmOrder
  tags:
    - Live
  summary: Confirm a free order with the emailed code
  description: >-
    Issues the tickets (one per seat, signed QR) and opens a customer session for the order. Five wrong codes per order per 30 minutes; a token for an order that does not exist behaves like a wrong code.
  security: []
  x-application: live
  x-status: implemented
  x-authorization: Public (code from the email).
  x-idempotency: Confirming twice issues nothing new.
  x-source: apps/live/src/pages/api/orders/confirm.ts
  parameters: []
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ticketing/ConfirmOrderResponse.yaml
    '400':
      $ref: ../components/responses/TicketingError.yaml
    '403':
      $ref: ../components/responses/TicketingError.yaml
    '404':
      $ref: ../components/responses/TicketingError.yaml
    '409':
      $ref: ../components/responses/TicketingError.yaml
    '410':
      $ref: ../components/responses/TicketingError.yaml
    '429':
      $ref: ../components/responses/TicketingError.yaml
    '503':
      $ref: ../components/responses/TicketingError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ticketing/ConfirmOrderInput.yaml
