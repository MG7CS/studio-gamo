servers:
  - url: http://127.0.0.1:4326
    description: Local admin application
post:
  operationId: reviewEvent
  tags:
    - Administration
  summary: Review Christian event
  description: Requires Access boundary plus active D1 session with staff_reviewer
    or superadmin role. No demo reviewer fallback.
  security:
    - CloudflareAccess: []
      BrowserSession: []
    - EmergencyBearer: []
      BrowserSession: []
    - EmergencyKey: []
      BrowserSession: []
    - EmergencyBasic: []
      BrowserSession: []
  x-application: admin
  x-status: implemented
  x-authorization: Access boundary AND D1 staff session; own-organization moderation forbidden.
  x-idempotency: Unsupported; client keys are ignored.
  x-source: apps/admin/src/pages/api/events/[id]/review.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    "200":
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/administration/ReviewResponse.yaml
    "400":
      $ref: ../components/responses/LegacyError.yaml
    "401":
      description: Middleware denies access
      content:
        text/html:
          schema:
            type: string
        application/json:
          schema:
            $ref: ../components/schemas/shared/LegacyError.yaml
      headers:
        WWW-Authenticate:
          schema:
            type: string
    "403":
      $ref: ../components/responses/LegacyError.yaml
    "404":
      $ref: ../components/responses/LegacyError.yaml
    "409":
      $ref: ../components/responses/LegacyError.yaml
    "500":
      $ref: ../components/responses/LegacyError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/administration/ReviewDecision.yaml
  x-internal: true
