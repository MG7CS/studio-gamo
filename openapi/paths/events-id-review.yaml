servers:
  - url: http://127.0.0.1:4326
    description: Local admin application
post:
  operationId: reviewEvent
  tags:
    - Administration
  summary: Review Christian event
  description: Internal only. revision_requested currently becomes rejected; this
    is a documented semantic mismatch pending workflow decision. Audit and
    moderation writes are not atomic.
  security:
    - CloudflareAccess: []
    - EmergencyBearer: []
    - EmergencyKey: []
    - EmergencyBasic: []
  x-application: admin
  x-status: implemented
  x-authorization: Access boundary only. Access subject is not mapped to D1
    reviewer user; domain permission verification deferred.
  x-idempotency: Unsupported; client keys are ignored.
  x-source: apps/admin/src/pages/api/events/[id]/review.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    "200":
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/administration/ReviewResponse.yaml
    "400":
      $ref: ../components/responses/LegacyError.yaml
    "401":
      description: Middleware denies access
      content:
        text/html:
          schema:
            type: string
      headers:
        WWW-Authenticate:
          schema:
            type: string
    "404":
      $ref: ../components/responses/LegacyError.yaml
    "500":
      $ref: ../components/responses/LegacyError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/administration/ReviewDecision.yaml
  x-internal: true
