servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: authorizeRepresentative
  tags:
    - Live
  summary: Authorize booking agent or manager for an artist
  description: Records scoped representation authorization with conflict detection
    for exclusive representation.
  security:
    - BrowserSession: []
  x-application: live
  x-status: implemented
  x-authorization: Verified artist owner or superadmin.
  x-idempotency: Rejects conflicting exclusive representation with 409.
  x-source: apps/live/src/pages/api/artists/[id]/representatives.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    "201":
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/live/RepresentationResponse.yaml
    "400":
      $ref: ../components/responses/LegacyError.yaml
    "401":
      $ref: ../components/responses/LegacyError.yaml
    "403":
      $ref: ../components/responses/LegacyError.yaml
    "404":
      $ref: ../components/responses/LegacyError.yaml
    "409":
      $ref: ../components/responses/LegacyError.yaml
    "500":
      $ref: ../components/responses/LegacyError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/live/AuthorizeRepresentativeInput.yaml
