servers:
  - url: http://127.0.0.1:4324
    description: Local live application
get:
  operationId: listEvents
  tags:
    - Live
  summary: Discover approved Christian events
  description: At most 50 results ordered by startsAt then id ascending.
    meta.total is returned row count, not all matching rows. No cursor or client
    limit yet. Unknown query fields are rejected.
  security: []
  x-application: live
  x-status: implemented
  x-authorization: Public
  x-idempotency: Unsupported; client keys are ignored.
  x-source: apps/live/src/pages/api/events/index.ts
  parameters:
    - name: category
      in: query
      description: Exact category filter.
      schema:
        $ref: ../components/schemas/live/EventFilters.yaml#/properties/category
    - name: city
      in: query
      description: Exact city filter.
      schema:
        $ref: ../components/schemas/live/EventFilters.yaml#/properties/city
    - name: artist
      in: query
      description: Performer or artist name substring filter.
      schema:
        $ref: ../components/schemas/live/EventFilters.yaml#/properties/artist
    - name: venue
      in: query
      description: Venue name substring filter.
      schema:
        $ref: ../components/schemas/live/EventFilters.yaml#/properties/venue
    - name: dateFrom
      in: query
      description: Minimum event start date (ISO 8601 date or timestamp).
      schema:
        $ref: ../components/schemas/live/EventFilters.yaml#/properties/dateFrom
    - name: dateTo
      in: query
      description: Maximum event start date (ISO 8601 date or timestamp).
      schema:
        $ref: ../components/schemas/live/EventFilters.yaml#/properties/dateTo
    - name: metro
      in: query
      description: Metro area slug filter (e.g., phoenix-az, atlanta-ga, nashville-tn).
      schema:
        $ref: ../components/schemas/live/EventFilters.yaml#/properties/metro
    - name: q
      in: query
      description: Free-text search query matching event title, performers, venue, or city.
      schema:
        $ref: ../components/schemas/live/EventFilters.yaml#/properties/q
    - name: weekend
      in: query
      description: Filter events occurring on Friday evening, Saturday, or Sunday in their local timezone.
      schema:
        $ref: ../components/schemas/live/EventFilters.yaml#/properties/weekend
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/live/EventListResponse.yaml
    '400':
      $ref: ../components/responses/LegacyError.yaml
    '500':
      $ref: ../components/responses/LegacyError.yaml
post:
  operationId: proposeEvent
  tags:
    - Live
  summary: Create an event (organizer)
  description: >-
    Two request shapes. The organizer form (EventEditInput: venue-local start date and time in an IANA
    zone, policies within bounds, ticket categories) creates the event, its policies and categories in one
    batch: the organizer's first event goes to pending_review, later ones publish once an event of that
    organizer was approved (unless staff set always_review). The older shape (CreateEvent with startsAt)
    is still accepted and always goes to review.
  security:
    - BrowserSession: []
  x-application: live
  x-status: implemented
  x-authorization: Active owner/admin membership of organizationId, or superadmin.
    Session verification required; no demo header bypass.
  x-idempotency: Unsupported; client keys are ignored.
  x-source: apps/live/src/pages/api/events/index.ts
  parameters: []
  responses:
    '201':
      description: Successful response
      content:
        application/json:
          schema:
            anyOf:
              - $ref: ../components/schemas/live/CreateEventResponse.yaml
              - $ref: ../components/schemas/ticketing/EventSavedResponse.yaml
    '400':
      description: Documented API failure. Internal details are suppressed.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: ../components/schemas/shared/LegacyError.yaml
              - $ref: ../components/schemas/ticketing/TicketingError.yaml
    '401':
      description: Documented API failure. Internal details are suppressed.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: ../components/schemas/shared/LegacyError.yaml
              - $ref: ../components/schemas/ticketing/TicketingError.yaml
    '403':
      description: Documented API failure. Internal details are suppressed.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: ../components/schemas/shared/LegacyError.yaml
              - $ref: ../components/schemas/ticketing/TicketingError.yaml
    '500':
      description: Documented API failure. Internal details are suppressed.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: ../components/schemas/shared/LegacyError.yaml
              - $ref: ../components/schemas/ticketing/TicketingError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ticketing/EventCreateRequest.yaml
