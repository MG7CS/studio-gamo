servers:
  - url: http://127.0.0.1:4324
    description: Local live application
get:
  operationId: listEvents
  tags:
    - Live
  summary: Discover approved Christian events
  description: At most 50 results ordered by startsAt then id ascending.
    meta.total is returned row count, not all matching rows. No cursor or client
    limit yet. Unknown query fields are rejected.
  security: []
  x-application: live
  x-status: implemented
  x-authorization: Public
  x-idempotency: Unsupported; client keys are ignored.
  x-source: apps/live/src/pages/api/events/index.ts
  parameters:
    - name: category
      in: query
      description: Exact category filter.
      schema:
        $ref: ../components/schemas/live/EventFilters.yaml#/properties/category
    - name: city
      in: query
      description: Exact city filter.
      schema:
        $ref: ../components/schemas/live/EventFilters.yaml#/properties/city
    - name: artist
      in: query
      description: Performer or artist name substring filter.
      schema:
        $ref: ../components/schemas/live/EventFilters.yaml#/properties/artist
    - name: venue
      in: query
      description: Venue name substring filter.
      schema:
        $ref: ../components/schemas/live/EventFilters.yaml#/properties/venue
    - name: dateFrom
      in: query
      description: Minimum event start date (ISO 8601 date or timestamp).
      schema:
        $ref: ../components/schemas/live/EventFilters.yaml#/properties/dateFrom
  responses:
    "200":
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/live/EventListResponse.yaml
    "400":
      $ref: ../components/responses/LegacyError.yaml
    "500":
      $ref: ../components/responses/LegacyError.yaml
post:
  operationId: proposeEvent
  tags:
    - Live
  summary: Submit event for review
  description: Submit event for review
  security:
    - BrowserSession: []
  x-application: live
  x-status: implemented
  x-authorization: Active owner/admin membership of organizationId, or superadmin.
    Session verification required; no demo header bypass.
  x-idempotency: Unsupported; client keys are ignored.
  x-source: apps/live/src/pages/api/events/index.ts
  parameters: []
  responses:
    "201":
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/live/CreateEventResponse.yaml
    "400":
      $ref: ../components/responses/LegacyError.yaml
    "401":
      $ref: ../components/responses/LegacyError.yaml
    "403":
      $ref: ../components/responses/LegacyError.yaml
    "500":
      $ref: ../components/responses/LegacyError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/live/CreateEvent.yaml
