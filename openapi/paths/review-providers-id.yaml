servers:
  - url: http://127.0.0.1:4326
    description: Local admin application
post:
  operationId: reviewProviderProfile
  tags:
    - Administration
  summary: Staff decision on a provider profile (church verification and provider review)
  description: >-
    schedule_meeting (date/time in the given IANA zone, default America/Phoenix; location;
    attending staff), start_review, verify (notes required; churches only after a scheduled meeting),
    request_changes (message), reject, suspend, reinstate. One D1 batch per decision: a status UPDATE
    conditional on expected_status, then the verification_records and audit_logs rows. A stale form or a
    concurrent decision changes nothing (error=CONFLICT). Self-review is refused. The provider is emailed
    through the outbox (honest when email is not configured). Redirects 303 to the review detail page.
  security:
    - CloudflareAccess: []
      BrowserSession: []
  x-application: admin
  x-status: implemented
  x-authorization: Staff boundary plus staff session (staff_reviewer or superadmin).
  x-idempotency: Conditional on expected_status; a repeated submission is refused as stale.
  x-source: apps/admin/src/pages/api/review/providers/[id].ts
  x-internal: true
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    '303':
      description: Form handled; redirects back to the page with the outcome in the query string.
      headers:
        Location:
          schema:
            type: string
    '400':
      $ref: ../components/responses/LegacyError.yaml
    '401':
      $ref: ../components/responses/LegacyError.yaml
    '403':
      $ref: ../components/responses/LegacyError.yaml
    '404':
      $ref: ../components/responses/LegacyError.yaml
    '415':
      $ref: ../components/responses/LegacyError.yaml
    '500':
      $ref: ../components/responses/LegacyError.yaml
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          $ref: ../components/schemas/administration/ProviderReviewForm.yaml
