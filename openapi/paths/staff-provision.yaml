servers:
  - url: http://127.0.0.1:4326
    description: Local admin application
post:
  operationId: provisionStaffIdentity
  tags:
    - Administration
  summary: Provision a staff user role and bind external Cloudflare Access identity
  description: Restricted to superadmin inside the Admin Access boundary. Creates
    or updates the target staff user, binds their immutable Cloudflare Access
    subject in external_identities, assigns the requested global staff role, and
    records an audit log entry.
  security:
    - CloudflareAccess: []
      BrowserSession: []
    - EmergencyBearer: []
      BrowserSession: []
    - EmergencyKey: []
      BrowserSession: []
    - EmergencyBasic: []
      BrowserSession: []
  x-application: admin
  x-status: implemented
  x-authorization: Access boundary AND D1 superadmin session required.
  x-idempotency: Re-provisioning the same user/role/subject updates the binding
    idempotently; conflicting subject binding returns 409.
  x-source: apps/admin/src/pages/api/staff/provision.ts
  parameters: []
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/administration/ProvisionStaffResponse.yaml
    '400':
      $ref: ../components/responses/LegacyError.yaml
    '401':
      description: Middleware denies access
      content:
        text/html:
          schema:
            type: string
        application/json:
          schema:
            $ref: ../components/schemas/shared/LegacyError.yaml
      headers:
        WWW-Authenticate:
          schema:
            type: string
    '403':
      $ref: ../components/responses/LegacyError.yaml
    '409':
      $ref: ../components/responses/LegacyError.yaml
    '500':
      $ref: ../components/responses/LegacyError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/administration/ProvisionStaffInput.yaml
  x-internal: true
