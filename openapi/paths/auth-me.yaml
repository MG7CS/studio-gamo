servers:
  - url: http://127.0.0.1:4321
    description: Local web application
get:
  operationId: getCurrentIdentity
  tags:
    - Identity and Accounts
  summary: Inspect current authenticated user, roles, and organization memberships
  description: Validates the active D1 session cookie and returns the
    authenticated user profile, global system roles, and active organization
    memberships.
  security:
    - BrowserSession: []
  x-application: web
  x-status: implemented
  x-authorization: Active D1 session required.
  x-idempotency: Read-only.
  x-source: apps/web/src/pages/api/auth/me.ts
  parameters: []
  responses:
    "200":
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/identity/AuthMeResponse.yaml
    "401":
      $ref: ../components/responses/LegacyError.yaml
    "500":
      $ref: ../components/responses/LegacyError.yaml
