servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: createTestCheckout
  tags:
    - Payments
  summary: Start paid checkout (Stripe test mode)
  description: >-
    Same order form as free RSVPs. 503 unless ENVIRONMENT is local or preview, STRIPE_TEST_CHECKOUT is true and a test key is set (production is always 503, in code); local without a key uses the local mock page. Holds the tickets in one batch and creates a Checkout Session whose expires_at covers the hold. An order whose total is 0 takes the free flow (202).
  security: []
  x-application: live
  x-status: implemented
  x-authorization: Public (Turnstile and rate limits).
  x-idempotency: idempotencyKey returns the same order; Stripe key checkout_<orderId>.
  x-source: apps/live/src/pages/api/checkout/session.ts
  parameters: []
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ticketing/CheckoutStarted.yaml
    '202':
      description: Free order; verification email sent
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ticketing/VerificationRequired.yaml
    '400':
      $ref: ../components/responses/TicketingError.yaml
    '403':
      $ref: ../components/responses/TicketingError.yaml
    '404':
      $ref: ../components/responses/TicketingError.yaml
    '409':
      $ref: ../components/responses/TicketingError.yaml
    '413':
      $ref: ../components/responses/TicketingError.yaml
    '415':
      $ref: ../components/responses/TicketingError.yaml
    '429':
      $ref: ../components/responses/TicketingError.yaml
    '502':
      $ref: ../components/responses/TicketingError.yaml
    '503':
      $ref: ../components/responses/TicketingError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ticketing/TicketCheckoutInput.yaml
      application/x-www-form-urlencoded:
        schema:
          type: object
          additionalProperties: true
          description: The same fields from the server-rendered form (quantities as qty.<categoryId>[.<sectionId>]).
