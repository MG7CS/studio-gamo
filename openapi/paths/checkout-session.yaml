servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: createTestCheckout
  tags:
    - Payments
  summary: Create sandbox checkout
  description: Creates a Stripe test-mode Checkout session for an authoritative
    ticket order. Returns 503 when paid checkout is not configured (no test-mode
    Stripe key outside local development) or when the event's order, inventory
    or organizer-authorization gate is not satisfied; no hold is created when
    Stripe is unconfigured. Cross-origin browser requests are rejected (403).
  security: []
  x-application: live
  x-status: implemented
  x-authorization: Public
  x-idempotency: Optional idempotencyKey is passed to order creation.
  x-source: apps/live/src/pages/api/checkout/session.ts
  parameters: []
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/payments/CheckoutResponse.yaml
    '400':
      $ref: ../components/responses/SimpleError.yaml
    '403':
      $ref: ../components/responses/SimpleError.yaml
    '409':
      $ref: ../components/responses/SimpleError.yaml
    '500':
      $ref: ../components/responses/SimpleError.yaml
    '503':
      $ref: ../components/responses/SimpleError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/payments/CheckoutInput.yaml
