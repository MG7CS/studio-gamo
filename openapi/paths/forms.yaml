servers:
  - url: http://127.0.0.1:4326
    description: Local admin application
get:
  operationId: listForms
  tags:
    - Forms
  summary: List forms
  description: All forms with status and latest published version.
  security:
    - BrowserSession: []
  x-application: admin
  x-status: planned
  x-authorization: Staff session (BrowserSession) behind the Admin Access boundary; same-origin check
    (requireSameOrigin) on every state-changing request; any staff role (role scoping is audit
    finding, not yet enforced).
  x-source: apps/admin/src/pages/api/forms/index.ts
  parameters: []
  responses:
    '200':
      description: Forms.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/forms/FormListResponse.yaml
    '401':
      $ref: ../components/responses/StaffUnauthorized.yaml
    '403': &a1
      $ref: ../components/responses/LegacyError.yaml
    '500': *a1
