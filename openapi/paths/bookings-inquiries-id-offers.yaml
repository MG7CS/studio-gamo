servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: proposeBookingOffer
  tags:
    - Live
  summary: Submit booking offer or counteroffer
  description: Authorized organizer, artist, or active representative submits a
    booking offer or counteroffer with separate artist fee, agent commission, and
    platform allocation line items.
  security:
    - BrowserSession: []
  x-application: live
  x-status: implemented
  x-authorization: Verified organizer negotiator, artist (when allowSelfBooking),
    or active unrevoked representative with negotiation scope.
  x-idempotency: Appends immutable offer revision.
  x-source: apps/live/src/pages/api/bookings/inquiries/[id]/offers.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    "201":
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/live/BookingOfferResponse.yaml
    "400":
      $ref: ../components/responses/LegacyError.yaml
    "401":
      $ref: ../components/responses/LegacyError.yaml
    "403":
      $ref: ../components/responses/LegacyError.yaml
    "404":
      $ref: ../components/responses/LegacyError.yaml
    "409":
      $ref: ../components/responses/LegacyError.yaml
    "500":
      $ref: ../components/responses/LegacyError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/live/ProposeBookingOfferInput.yaml
