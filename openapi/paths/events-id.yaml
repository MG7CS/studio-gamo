servers:
  - url: http://127.0.0.1:4324
    description: Local live application
get:
  operationId: getEvent
  tags:
    - Live
  summary: Read approved event
  description: Read approved event
  security: []
  x-application: live
  x-status: implemented
  x-authorization: Public
  x-idempotency: Unsupported; client keys are ignored.
  x-source: apps/live/src/pages/api/events/[id]/index.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/live/EventResponse.yaml
    '400':
      $ref: ../components/responses/LegacyError.yaml
    '404':
      $ref: ../components/responses/LegacyError.yaml
    '500':
      $ref: ../components/responses/LegacyError.yaml
patch:
  operationId: updateEvent
  tags:
    - Live
  summary: Edit an event (organizer)
  description: >-
    Edits details, policies and ticket categories (edit_content; categories also need manage_ticketing).
    Once tickets exist the date and venue change only through POST /api/events/{id}/changes so holders are
    told; capacity never goes below what is reserved; existing orders keep their policy snapshot and price.
  security:
    - BrowserSession: []
  x-application: live
  x-status: implemented
  x-authorization: Verified session with edit_content and manage_ticketing permissions on the event.
  x-idempotency: Last write wins; the same body twice is harmless.
  x-source: apps/live/src/pages/api/events/[id]/index.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ticketing/EventSavedResponse.yaml
    '400':
      $ref: ../components/responses/TicketingError.yaml
    '401':
      $ref: ../components/responses/TicketingError.yaml
    '403':
      $ref: ../components/responses/TicketingError.yaml
    '404':
      $ref: ../components/responses/TicketingError.yaml
    '409':
      $ref: ../components/responses/TicketingError.yaml
    '503':
      $ref: ../components/responses/TicketingError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ticketing/EventEditInput.yaml
