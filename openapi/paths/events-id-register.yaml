servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: registerAttendee
  tags:
    - Live
  summary: Reserve free tickets (email verification required)
  description: >-
    Free RSVP (design 4.2): Turnstile, per-IP and per-email limits, validation, one atomic hold batch, then an email with a 6-digit code and a confirm link. Tickets are issued only after the email is confirmed (POST /api/orders/confirm or the link). The answer is identical whether or not the address already has tickets. Sold out returns 409 with remaining counts per category.
  security: []
  x-application: live
  x-status: implemented
  x-authorization: Public (Turnstile and rate limits).
  x-idempotency: idempotencyKey (rendered into the form) returns the same order.
  x-source: apps/live/src/pages/api/events/[id]/register.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    '202':
      description: Verification email sent (or the identical answer)
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ticketing/VerificationRequired.yaml
    '400':
      $ref: ../components/responses/TicketingError.yaml
    '403':
      $ref: ../components/responses/TicketingError.yaml
    '404':
      $ref: ../components/responses/TicketingError.yaml
    '409':
      $ref: ../components/responses/TicketingError.yaml
    '413':
      $ref: ../components/responses/TicketingError.yaml
    '415':
      $ref: ../components/responses/TicketingError.yaml
    '429':
      $ref: ../components/responses/TicketingError.yaml
    '503':
      $ref: ../components/responses/TicketingError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ticketing/OrderInput.yaml
      application/x-www-form-urlencoded:
        schema:
          type: object
          additionalProperties: true
          description: The same fields from the server-rendered form (quantities as qty.<categoryId>[.<sectionId>]).
