servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: registerAttendee
  tags:
    - Live
  summary: Register for a free event
  description: Public free registration. Never returns admission tokens or
    attendee records. Database enforces capacity and duplicate email/event
    uniqueness; confirmation is queued durably.
  security: []
  x-application: live
  x-status: implemented
  x-authorization: Public
  x-idempotency: Normalized email plus event; duplicate response contains no pass
    or personal data.
  x-source: apps/live/src/pages/api/events/[id]/register.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/live/RegistrationResponse.yaml
    '201':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/live/RegistrationResponse.yaml
    '400':
      $ref: ../components/responses/LegacyError.yaml
    '403':
      $ref: ../components/responses/LegacyError.yaml
    '404':
      $ref: ../components/responses/LegacyError.yaml
    '409':
      $ref: ../components/responses/LegacyError.yaml
    '500':
      $ref: ../components/responses/LegacyError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/live/RegisterAttendee.yaml
