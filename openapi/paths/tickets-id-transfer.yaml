servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: transferTicket
  tags:
    - Live
  summary: Transfer a ticket to another person
  description: >-
    The current holder only (customer session), within the order's policy snapshot. Bumps the version so every old QR stops working. Of two concurrent transfers of one ticket exactly one succeeds (409 for the other).
  security:
    - CustomerSession: []
  x-application: live
  x-status: implemented
  x-authorization: Customer session holding the ticket.
  x-idempotency: Conditional on the ticket version the holder saw.
  x-source: apps/live/src/pages/api/tickets/[id]/transfer.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ticketing/TicketVersionResponse.yaml
    '400':
      $ref: ../components/responses/TicketingError.yaml
    '401':
      $ref: ../components/responses/TicketingError.yaml
    '403':
      $ref: ../components/responses/TicketingError.yaml
    '404':
      $ref: ../components/responses/TicketingError.yaml
    '409':
      $ref: ../components/responses/TicketingError.yaml
    '503':
      $ref: ../components/responses/TicketingError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ticketing/TransferInput.yaml
