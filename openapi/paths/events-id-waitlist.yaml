servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: joinWaitlist
  tags:
    - Live
  summary: Join the waitlist of a sold-out event
  description: >-
    Same answer whether or not the address was already waiting. When tickets are released the earliest entries are emailed; nothing is reserved or charged.
  security: []
  x-application: live
  x-status: implemented
  x-authorization: Public (Turnstile and rate limits).
  x-idempotency: One entry per event, category and address.
  x-source: apps/live/src/pages/api/events/[id]/waitlist.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    '202':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ticketing/AcceptedMessage.yaml
    '400':
      $ref: ../components/responses/TicketingError.yaml
    '403':
      $ref: ../components/responses/TicketingError.yaml
    '404':
      $ref: ../components/responses/TicketingError.yaml
    '413':
      $ref: ../components/responses/TicketingError.yaml
    '415':
      $ref: ../components/responses/TicketingError.yaml
    '429':
      $ref: ../components/responses/TicketingError.yaml
    '503':
      $ref: ../components/responses/TicketingError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ticketing/WaitlistInput.yaml
      application/x-www-form-urlencoded:
        schema:
          type: object
          additionalProperties: true
          description: The same fields from the server-rendered form (quantities as qty.<categoryId>[.<sectionId>]).
