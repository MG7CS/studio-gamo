servers:
  - url: http://127.0.0.1:4326
    description: Local admin application
post:
  operationId: publishForm
  tags:
    - Forms
  summary: Publish the draft as a new immutable version
  description: Snapshots the draft into a new form_versions row after checkPublishable. Refused with
    400 (details list the reasons) when a bind key required by the form kind is missing, ids are
    duplicated, or a showIf points at an unknown or later question. Submissions keep the version
    they answered.
  security:
    - BrowserSession: []
  x-application: admin
  x-status: planned
  x-authorization: Staff session (BrowserSession) behind the Admin Access boundary; same-origin check
    (requireSameOrigin) on every state-changing request; any staff role (role scoping is audit
    finding, not yet enforced).
  x-source: apps/admin/src/pages/api/forms/[id]/publish.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    '200':
      description: Published.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/forms/PublishFormResponse.yaml
    '303':
      $ref: ../components/responses/SeeOther.yaml
    '400': &a1
      $ref: ../components/responses/LegacyError.yaml
    '401':
      $ref: ../components/responses/StaffUnauthorized.yaml
    '403': *a1
    '404': *a1
    '500': *a1
  x-internal: true
