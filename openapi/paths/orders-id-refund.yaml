servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: processOrderRefund
  tags:
    - Payments
  summary: Refund (paid) or cancel (free) chosen tickets
  description: >-
    Requires approve_refunds on the event. Only the chosen tickets (all valid ones when none are given) change; refunds accumulate and never exceed the total; card refunds go through Stripe test mode.
  security:
    - BrowserSession: []
  x-application: live
  x-status: implemented
  x-authorization: Verified session with approve_refunds permission on the event.
  x-idempotency: Repeating a refund of the same tickets changes nothing; Stripe key refund_<recordId>.
  x-source: apps/live/src/pages/api/orders/[id]/refund.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ticketing/RefundResponse.yaml
    '400':
      $ref: ../components/responses/TicketingError.yaml
    '401':
      $ref: ../components/responses/TicketingError.yaml
    '403':
      $ref: ../components/responses/TicketingError.yaml
    '404':
      $ref: ../components/responses/TicketingError.yaml
    '409':
      $ref: ../components/responses/TicketingError.yaml
    '502':
      $ref: ../components/responses/TicketingError.yaml
    '503':
      $ref: ../components/responses/TicketingError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ticketing/RefundInput.yaml
