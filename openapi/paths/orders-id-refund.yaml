servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: processOrderRefund
  tags:
    - Payments
  summary: Approve and process ticket order refund
  description: Requires explicit approve_refunds authority on the order's event
    (publishing/content authority alone is insufficient). Voids issued tickets,
    releases reserved capacity, and records refund ledger entry.
  security:
    - BrowserSession: []
  x-application: live
  x-status: implemented
  x-authorization: Verified session with approve_refunds permission on the event.
  x-idempotency: Rejects duplicate full refund with 409.
  x-source: apps/live/src/pages/api/orders/[id]/refund.ts
  parameters:
    - $ref: ../components/parameters/id.yaml
  responses:
    "200":
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/live/OrderRefundResponse.yaml
    "400":
      $ref: ../components/responses/LegacyError.yaml
    "401":
      $ref: ../components/responses/LegacyError.yaml
    "403":
      $ref: ../components/responses/LegacyError.yaml
    "404":
      $ref: ../components/responses/LegacyError.yaml
    "409":
      $ref: ../components/responses/LegacyError.yaml
    "500":
      $ref: ../components/responses/LegacyError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/live/OrderRefundInput.yaml
