servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: receiveStripeWebhook
  tags:
    - Payments
  summary: Receive a signed Stripe test event
  description: >-
    Signature and test mode verified. Claims the event id (409 while another delivery is processing) and dispatches checkout.session.completed and async_payment_succeeded (issue tickets once; amount, currency and payment status checked; paid after the stock is gone becomes paid_unfulfillable with an automatic test refund), checkout.session.expired, charge.refunded, refund.updated and charge.dispute.created; other types are recorded as ignored. Failures answer 500 so Stripe retries; 503 without STRIPE_WEBHOOK_SECRET.
  security:
    - StripeSignature: []
  x-application: live
  x-status: implemented
  x-authorization: Public (Stripe signature).
  x-idempotency: Stripe event id claimed in D1; per-seat issuance is idempotent.
  x-source: apps/live/src/pages/api/webhook/stripe.ts
  parameters: []
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ticketing/StripeWebhookResponse.yaml
    '400':
      $ref: ../components/responses/TicketingError.yaml
    '409':
      $ref: ../components/responses/TicketingError.yaml
    '500':
      $ref: ../components/responses/TicketingError.yaml
    '503':
      $ref: ../components/responses/TicketingError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/payments/StripeEvent.yaml
