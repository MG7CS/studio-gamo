servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: receiveStripeWebhook
  tags:
    - Payments
  summary: Receive signed test Stripe event
  description: Raw signature and sandbox verified. Financial events return 503
    without marking processed; unsupported events safely deduplicated. No ticket
    or refund fulfillment.
  security:
    - StripeSignature: []
  x-application: live
  x-status: implemented
  x-authorization: Public
  x-idempotency: Stripe event ID in D1; failure retry and concurrent claim
    correctness remain blockers.
  x-source: apps/live/src/pages/api/webhook/stripe.ts
  parameters: []
  responses:
    "200":
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/payments/WebhookResponse.yaml
    "400":
      $ref: ../components/responses/SimpleError.yaml
    "500":
      $ref: ../components/responses/SimpleError.yaml
    "503":
      $ref: ../components/responses/SimpleError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/payments/StripeEvent.yaml
