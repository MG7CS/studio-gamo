servers:
  - url: http://127.0.0.1:4324
    description: Local live application
post:
  operationId: createBookingInquiry
  tags:
    - Live
  summary: Send artist booking inquiry
  description: Verified organizer sends a booking inquiry and initial proposed
    terms to an artist or authorized representative.
  security:
    - BrowserSession: []
  x-application: live
  x-status: implemented
  x-authorization: Verified session with organization owner/admin or event
    negotiate_booking permission.
  x-idempotency: Creates distinct inquiry record.
  x-source: apps/live/src/pages/api/bookings/inquiries/index.ts
  parameters: []
  responses:
    '201':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/live/BookingInquiryResponse.yaml
    '400':
      $ref: ../components/responses/LegacyError.yaml
    '401':
      $ref: ../components/responses/LegacyError.yaml
    '403':
      $ref: ../components/responses/LegacyError.yaml
    '404':
      $ref: ../components/responses/LegacyError.yaml
    '500':
      $ref: ../components/responses/LegacyError.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/live/CreateBookingInquiryInput.yaml
