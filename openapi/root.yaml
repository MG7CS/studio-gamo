  /api/review/events/{id}:
    $ref: paths/review-events-id.yaml
  /api/review/organizers/{id}:
    $ref: paths/review-organizers-id.yaml
  # --- end agent A ---
  # --- agent C --- (door scanning, offline manifest, venue blueprints)
  /api/scanner/scan:
    $ref: paths/scanner-scan.yaml
  /api/scanner/lookup:
    $ref: paths/scanner-lookup.yaml
  /api/scanner/override:
    $ref: paths/scanner-override.yaml
  /api/scanner/manifest:
    $ref: paths/scanner-manifest.yaml
  /api/scanner/sync:
    $ref: paths/scanner-sync.yaml
  /api/scanner/headcount:
    $ref: paths/scanner-headcount.yaml
  /api/venue-maps/{id}:
    $ref: paths/venue-maps-id.yaml
  # --- end agent C ---
