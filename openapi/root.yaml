  /api/webhook/stripe:
    $ref: paths/webhook-stripe.yaml
  /api/events/pending:
    $ref: paths/events-pending.yaml
  /api/events/{id}/review:
    $ref: paths/events-id-review.yaml
  /api/staff/provision:
    $ref: paths/staff-provision.yaml
  # --- agent A (identity, onboarding, review) ---
  /api/auth/clerk-webhook:
    $ref: paths/auth-clerk-webhook.yaml
  /api/account/person-link:
    $ref: paths/account-person-link.yaml
  /api/account/providers:
