openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Gamo Studios HTTP API — local foundation
  version: 4.0.0
  description: Authoritative contract for Gamo Studios, a Christian,
    mission-driven Public Benefit Corporation. Demo/incomplete operations are explicitly
    labeled. Internal operations must not be published. No production readiness
    or payment authorization implied.
  license:
    name: Private repository; no public API license
servers:
  - url: http://127.0.0.1:4321
    description: Local global site (web); each path specifies its owning application.
security: []
tags:
  - name: Worship
    description: Worship domain. No endpoint existence implied by tag.
  - name: Academy
    description: Academy domain. No endpoint existence implied by tag.
  - name: Production
    description: Production domain. No endpoint existence implied by tag.
  - name: Partnerships
    description: Partnerships domain. No endpoint existence implied by tag.
  - name: Media
    description: Media domain. No endpoint existence implied by tag.
  - name: Administration
    description: Administration domain. No endpoint existence implied by tag.
  - name: Email
    description: Email delivery domain (provider delivery events and suppressions). No endpoint existence implied by tag.
paths:
  /api/staff/provision:
    $ref: paths/staff-provision.yaml
  /api/webhook/resend:
    $ref: paths/webhook-resend.yaml
components:
  schemas:
    Identifier:
      $ref: components/schemas/shared/Identifier.yaml
    Timestamp:
      $ref: components/schemas/shared/Timestamp.yaml
    ListMeta:
      $ref: components/schemas/shared/ListMeta.yaml
    LegacyError:
      $ref: components/schemas/shared/LegacyError.yaml
    SimpleError:
      $ref: components/schemas/shared/SimpleError.yaml
    Problem:
      $ref: components/schemas/shared/Problem.yaml
    User:
      $ref: components/schemas/administration/User.yaml
    ProvisionStaffInput:
      $ref: components/schemas/administration/ProvisionStaffInput.yaml
    ProvisionStaffResponse:
      $ref: components/schemas/administration/ProvisionStaffResponse.yaml
    ResendEvent:
      $ref: components/schemas/email/ResendEvent.yaml
    ResendWebhookResponse:
      $ref: components/schemas/email/ResendWebhookResponse.yaml
  securitySchemes:
    BrowserSession:
      $ref: components/security/BrowserSession.yaml
    CloudflareAccess:
      $ref: components/security/CloudflareAccess.yaml
    EmergencyBearer:
      $ref: components/security/EmergencyBearer.yaml
    EmergencyKey:
      $ref: components/security/EmergencyKey.yaml
    EmergencyBasic:
      $ref: components/security/EmergencyBasic.yaml
