openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Gamo Studios HTTP API — local foundation
  version: 2.1.0
  description: Authoritative contract for Gamo Studios, a Christian,
    mission-driven Public Benefit Corporation. Demo/incomplete operations are explicitly
    labeled. Internal operations must not be published. No production readiness
    or payment authorization implied.
  license:
    name: Private repository; no public API license
servers:
  - url: http://127.0.0.1:4324
    description: Local Gamo Live; each path specifies its owning application.
security: []
tags:
  - name: Identity and Accounts
    description: Identity and Accounts domain. No endpoint existence implied by tag.
  - name: Organizations and Memberships
    description: Organizations and Memberships domain. No endpoint existence implied by tag.
  - name: Worship
    description: Worship domain. No endpoint existence implied by tag.
  - name: Academy
    description: Academy domain. No endpoint existence implied by tag.
  - name: Live
    description: Live domain. No endpoint existence implied by tag.
  - name: Production
    description: Production domain. No endpoint existence implied by tag.
  - name: Partnerships
    description: Partnerships domain. No endpoint existence implied by tag.
  - name: Media
    description: Media domain. No endpoint existence implied by tag.
  - name: Administration
    description: Administration domain. No endpoint existence implied by tag.
  - name: Payments
    description: Payments domain. No endpoint existence implied by tag.
paths:
  /api/participation:
    $ref: paths/participation.yaml
  /api/participation/review-queue:
    $ref: paths/participation-review-queue.yaml
  /api/participation/{id}/review:
