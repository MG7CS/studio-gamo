type: object
additionalProperties: false
properties:
  kind:
    enum:
      - cancelled
      - rescheduled
      - venue_changed
  reason:
    type: string
    maxLength: 500
  startDate:
    type: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
  startTime:
    type: string
    pattern: '^\d{2}:\d{2}$'
  endDate:
    type: string
    pattern: '^(\d{4}-\d{2}-\d{2})?$'
  endTime:
    type: string
    pattern: '^(\d{2}:\d{2})?$'
  timezone:
    type: string
    maxLength: 64
  venueName:
    type: string
    maxLength: 200
  address:
    type: string
    maxLength: 300
  city:
    type: string
    maxLength: 100
  state:
    type: string
    maxLength: 50
required:
  - kind
