type: object
additionalProperties: false
description: Organizer event create/edit with venue-local date/time, policies and categories.
properties:
  organizationId:
    $ref: ../shared/Identifier.yaml
  title:
    type: string
    minLength: 3
    maxLength: 150
  category:
    enum:
      - concert
      - worship
      - bible
      - conference
      - youth
  tagline:
    type: string
    maxLength: 250
  description:
    type: string
    minLength: 20
    maxLength: 10000
  venueName:
    type: string
    minLength: 2
    maxLength: 200
  address:
    type: string
    maxLength: 300
  city:
    type: string
    minLength: 2
    maxLength: 100
  state:
    type: string
    minLength: 2
    maxLength: 50
  timezone:
    type: string
    maxLength: 64
  start:
    $ref: LocalDateTime.yaml
  end:
    anyOf:
      - $ref: LocalDateTime.yaml
      - type: 'null'
  admissionType:
    enum:
      - free
      - paid
  categories:
    type: array
    minItems: 1
    maxItems: 12
    items:
      $ref: CategoryInput.yaml
  policy:
    $ref: EventPolicyInput.yaml
required:
  - title
  - category
  - description
  - venueName
  - city
  - state
  - timezone
  - start
  - admissionType
  - categories
