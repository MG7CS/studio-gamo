type: object
additionalProperties: false
properties:
  success:
    const: true
  data:
    type: object
    additionalProperties: false
    properties:
      status:
        const: checkout
      orderId:
        type: string
      orderReference:
        type: string
      checkoutUrl:
        type: string
        description: Stripe Checkout (test mode) or, in local development only, the local mock page.
      mock:
        type: boolean
      holdExpiresAt:
        type: integer
    required:
      - status
      - orderId
      - orderReference
      - checkoutUrl
      - mock
      - holdExpiresAt
required:
  - success
  - data
