type: object
additionalProperties: false
description: One form for free RSVPs and paid checkout. The JSON form of the server-rendered order
  form (which posts the same fields form-encoded as qty.<categoryId>[.<sectionId>]).
properties:
  eventId:
    $ref: ../shared/Identifier.yaml
  items:
    type: array
    minItems: 1
    maxItems: 20
    items:
      $ref: OrderItemInput.yaml
  purchaserName:
    type: string
    minLength: 2
    maxLength: 120
  email:
    type: string
    maxLength: 320
  emailConfirm:
    type: string
    maxLength: 320
  attendeeNames:
    type: array
    maxItems: 20
    items:
      type: string
      maxLength: 120
  termsAccepted:
    type: boolean
  termsDocuments:
    type: array
    maxItems: 4
    items:
      $ref: TermsDocumentRef.yaml
  marketingOptIn:
    type: boolean
  idempotencyKey:
    type: string
    pattern: '^[A-Za-z0-9_-]{16,100}$'
  cf-turnstile-response:
    type: string
    maxLength: 2048
required:
  - eventId
  - items
  - purchaserName
  - email
  - emailConfirm
  - termsAccepted
  - termsDocuments
  - idempotencyKey
