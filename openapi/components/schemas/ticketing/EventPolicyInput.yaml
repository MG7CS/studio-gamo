type: object
additionalProperties: false
description: Event policies within the platform bounds (design §5.4). Missing fields take the defaults.
properties:
  reentryAllowed:
    type: boolean
  reentryLimit:
    type:
      - integer
      - 'null'
    minimum: 1
    maximum: 20
  refundPolicy:
    enum:
      - none
      - until_start
      - until_24h
      - until_48h
      - until_7d
      - organizer_discretion
  transferAllowed:
    type: boolean
  transferCutoffHours:
    type: integer
  maxTransfersPerTicket:
    type: integer
  attendeeNamesRequired:
    type: boolean
  maxTicketsPerOrder:
    type: integer
  doorSalesEnabled:
    type: boolean
  doorSalesMethods:
    type: array
    maxItems: 2
    items:
      enum:
        - free_issue
        - cash_recorded
  agePolicy:
    enum:
      - all_ages
      - min_age
  minAge:
    type:
      - integer
      - 'null'
  scanOpensMinutesBefore:
    type: integer
