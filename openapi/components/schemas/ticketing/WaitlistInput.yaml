type: object
additionalProperties: false
properties:
  email:
    type: string
    format: email
    maxLength: 254
    pattern: '^[A-Za-z0-9.!#$%&''*+/=?^_`{|}~-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$'
  categoryId:
    $ref: ../shared/Identifier.yaml
  quantity:
    type: integer
    minimum: 1
    maximum: 20
  cf-turnstile-response:
    type: string
    maxLength: 2048
required:
  - email
