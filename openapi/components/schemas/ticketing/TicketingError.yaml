type: object
additionalProperties: false
description: Ticketing failure. `message` always says what to do next. `details` is a list of field
  errors (public form guard) or an object with field errors, remaining counts (409 SOLD_OUT) and a
  wait time (429).
properties:
  success:
    const: false
  error:
    type: object
    additionalProperties: false
    properties:
      code:
        type: string
      message:
        type: string
      details:
        anyOf:
          - type: array
            items:
              type: object
              additionalProperties: false
              properties:
                field:
                  type: string
                message:
                  type: string
                code:
                  type: string
              required:
                - field
                - message
          - type: object
            additionalProperties: false
            properties:
              fields:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    field:
                      type: string
                    message:
                      type: string
                  required:
                    - field
                    - message
              remaining:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    categoryId:
                      type: string
                    sectionId:
                      type:
                        - string
                        - 'null'
                    name:
                      type: string
                    remaining:
                      type: integer
                      minimum: 0
                  required:
                    - categoryId
                    - sectionId
                    - name
                    - remaining
              retryAfterSeconds:
                type: integer
    required:
      - code
      - message
required:
  - success
  - error
