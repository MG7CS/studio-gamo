type: object
additionalProperties: false
properties:
  eventId:
    $ref: ../shared/Identifier.yaml
  tierIndex:
    type: integer
    minimum: 0
    default: 0
  quantity:
    type: integer
    minimum: 1
    maximum: 10
    default: 1
  customerEmail:
    type: string
    format: email
  customerName:
    type: string
    minLength: 2
    maxLength: 120
  idempotencyKey:
    type: string
    minLength: 4
    maxLength: 120
required:
  - eventId
