type: object
additionalProperties: true
properties:
  id:
    type: string
  object:
    const: event
  type:
    type: string
  created:
    type: integer
  livemode:
    const: false
  data:
    type: object
    # Stripe adds fields such as previous_attributes (on *.updated events).
    additionalProperties: true
    properties:
      object:
        type: object
        additionalProperties: true
    required:
      - object
required:
  - id
  - type
  - data
  - livemode
