type: object
additionalProperties: false
properties:
  email:
    type: string
    format: email
    minLength: 3
    maxLength: 254
  role:
    type: string
    enum:
      - staff_reviewer
      - finance_manager
      - superadmin
  accessSubject:
    type: string
    minLength: 1
    maxLength: 255
  displayName:
    type: string
    minLength: 1
    maxLength: 120
required:
  - email
  - role
  - accessSubject
