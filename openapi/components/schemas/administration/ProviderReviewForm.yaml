type: object
additionalProperties: false
properties:
  action:
    type: string
    enum:
      - schedule_meeting
      - start_review
      - verify
      - request_changes
      - reject
      - suspend
      - reinstate
  expected_status:
    type: string
    maxLength: 40
  notes:
    type: string
    maxLength: 2000
  meeting_at:
    type: string
    description: Local date and time (YYYY-MM-DDTHH:MM) in meeting_zone.
    maxLength: 20
  meeting_zone:
    type: string
    description: IANA time zone of meeting_at (default America/Phoenix).
    maxLength: 64
  meeting_location:
    type: string
    maxLength: 300
  meeting_staff:
    type: string
    maxLength: 120
required:
  - action
  - expected_status
