type: object
additionalProperties: false
properties:
  id:
    $ref: ../shared/Identifier.yaml
  reference:
    type: string
    description: Human reference such as GW-2026-0001 (GW worship, GP production, GS web).
  formId:
    $ref: ../shared/Identifier.yaml
  formTitle:
    type: string
  kind:
    $ref: ./FormKind.yaml
  status:
    $ref: ./SubmissionStatus.yaml
  submitterName:
    type:
      - string
      - 'null'
  submitterEmail:
    type:
      - string
      - 'null'
    format: email
  submittedAt:
    $ref: ../shared/Timestamp.yaml
required:
  - id
  - reference
  - formId
  - formTitle
  - kind
  - status
  - submittedAt
