type: object
additionalProperties: false
properties:
  slug:
    type: string
    minLength: 1
    maxLength: 80
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  program:
    $ref: ./FormProgram.yaml
  kind:
    $ref: ./FormKind.yaml
  title:
    type: string
    minLength: 1
    maxLength: 200
  description:
    type: string
    maxLength: 2000
  confirmationMessage:
    type: string
    maxLength: 2000
  schema:
    $ref: ./FormSchema.yaml
required:
  - slug
  - program
  - kind
  - title
