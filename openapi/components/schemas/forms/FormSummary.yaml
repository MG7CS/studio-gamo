type: object
additionalProperties: false
properties:
  id:
    $ref: ../shared/Identifier.yaml
  slug:
    type: string
  program:
    $ref: ./FormProgram.yaml
  kind:
    $ref: ./FormKind.yaml
  title:
    type: string
  status:
    $ref: ./FormStatus.yaml
  currentVersion:
    type:
      - integer
      - 'null'
    minimum: 1
    description: Latest published version number; null while only a draft exists.
  updatedAt:
    $ref: ../shared/Timestamp.yaml
required:
  - id
  - slug
  - program
  - kind
  - title
  - status
  - currentVersion
  - updatedAt
