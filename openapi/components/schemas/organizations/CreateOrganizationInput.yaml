type: object
additionalProperties: false
properties:
  name:
    type: string
    minLength: 2
    maxLength: 160
  slug:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    minLength: 2
    maxLength: 80
  type:
    type: string
    enum:
      - church
      - ministry
      - school
      - sponsor
      - other
required:
  - name
  - slug
  - type
