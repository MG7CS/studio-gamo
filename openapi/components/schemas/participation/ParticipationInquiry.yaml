type: object
additionalProperties: false
required:
  - id
  - userId
  - kind
  - interest
  - name
  - organization
  - message
  - status
  - reviewNotes
  - createdAt
  - reviewedAt
properties:
  id:
    type: string
  userId:
    type: string
  kind:
    type: string
    enum:
      - general
      - partnership
  interest:
    type: string
    minLength: 2
    maxLength: 80
  name:
    type: string
    minLength: 2
    maxLength: 120
  organization:
    type:
      - string
      - 'null'
  message:
    type: string
    minLength: 10
    maxLength: 4000
  status:
    type: string
    enum:
      - pending
      - reviewed
      - closed
  reviewNotes:
    type:
      - string
      - 'null'
  createdAt:
    type: string
    format: date-time
  reviewedAt:
    type:
      - string
      - 'null'
    format: date-time
