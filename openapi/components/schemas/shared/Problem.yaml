type: object
additionalProperties: false
properties:
  type:
    type: string
    format: uri-reference
  title:
    type: string
  status:
    type: integer
    minimum: 400
    maximum: 599
  detail:
    type: string
  instance:
    type: string
    format: uri-reference
  errors:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string
      required:
        - field
        - message
        - code
required:
  - type
  - title
  - status
