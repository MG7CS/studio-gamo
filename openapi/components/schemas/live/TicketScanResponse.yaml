type: object
additionalProperties: false
properties:
  success:
    const: true
  data:
    type: object
    additionalProperties: false
    properties:
      scanId:
        type: string
      eventId:
        type: string
      outcome:
        type: string
        enum:
          - admitted
      holderName:
        type: string
      checkedInAt:
        type: string
    required:
      - scanId
      - eventId
      - outcome
      - holderName
      - checkedInAt
required:
  - success
  - data
