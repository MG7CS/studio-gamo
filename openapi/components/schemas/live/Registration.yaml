type: object
additionalProperties: false
properties:
  id:
    $ref: ../shared/Identifier.yaml
  eventId:
    $ref: ../shared/Identifier.yaml
  tierId:
    anyOf:
      - $ref: ../shared/Identifier.yaml
      - type: 'null'
  userId:
    anyOf:
      - $ref: ../shared/Identifier.yaml
      - type: 'null'
  attendeeName:
    type: string
  attendeeEmail:
    type: string
    format: email
  quantity:
    type: integer
    minimum: 1
    maximum: 10
  qrToken:
    type: string
  status:
    type: string
  checkedInAt:
    anyOf:
      - $ref: ../shared/Timestamp.yaml
      - type: 'null'
  createdAt:
    $ref: ../shared/Timestamp.yaml
required:
  - id
  - eventId
  - tierId
  - userId
  - attendeeName
  - attendeeEmail
  - quantity
  - qrToken
  - status
  - checkedInAt
  - createdAt
