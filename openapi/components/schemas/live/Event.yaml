type: object
additionalProperties: false
properties:
  id:
    $ref: ../shared/Identifier.yaml
  organizerId:
    $ref: ../shared/Identifier.yaml
  title:
    type: string
  slug:
    type: string
  category:
    type: string
    enum:
      - concert
      - worship
      - bible
      - conference
      - youth
  tagline:
    anyOf:
      - type: string
      - type: 'null'
  description:
    type: string
  venueName:
    type: string
  address:
    anyOf:
      - type: string
      - type: 'null'
  city:
    type: string
  state:
    type: string
  startsAt:
    $ref: ../shared/Timestamp.yaml
  endsAt:
    anyOf:
      - $ref: ../shared/Timestamp.yaml
      - type: 'null'
  timezone:
    type: string
  admissionType:
    type: string
    enum:
      - free
      - paid
      - external
  photoKey:
    anyOf:
      - type: string
      - type: 'null'
  externalUrl:
    anyOf:
      - type: string
      - type: 'null'
  status:
    type: string
    enum:
      - draft
      - pending_review
      - approved
      - rejected
      - revision_requested
      - canceled
  createdAt:
    $ref: ../shared/Timestamp.yaml
  listingType:
    type: string
    enum:
      - organizer_submitted
      - external_discovery
  importKey:
    anyOf:
      - type: string
      - type: 'null'
  metroSlug:
    anyOf:
      - type: string
      - type: 'null'
  startDateLocal:
    anyOf:
      - type: string
      - type: 'null'
  startTimeLocal:
    anyOf:
      - type: string
      - type: 'null'
  publishedByLabel:
    anyOf:
      - type: string
      - type: 'null'
  publishedByUserId:
    anyOf:
      - type: string
      - type: 'null'
  originalOrganizerName:
    anyOf:
      - type: string
      - type: 'null'
  externalDestinationKind:
    anyOf:
      - type: string
      - type: 'null'
  externalTicketProvider:
    anyOf:
      - type: string
      - type: 'null'
  externalOnly:
    type: boolean
  priceMinCents:
    anyOf:
      - type: integer
      - type: 'null'
  currency:
    type: string
  ticketAvailability:
    type: string
  sourceUrlsJson:
    anyOf:
      - type: string
      - type: 'null'
  lastVerifiedAt:
    anyOf:
      - $ref: ../shared/Timestamp.yaml
      - type: 'null'
  artworkUrl:
    anyOf:
      - type: string
      - type: 'null'
  artworkRightsVerified:
    type: boolean
  artworkLicenseCredit:
    anyOf:
      - type: string
      - type: 'null'
  editorialStatus:
    type: string
    enum:
      - draft
      - verified
      - approved
      - published
      - archived
      - canceled
      - rejected
  editorialNotes:
    anyOf:
      - type: string
      - type: 'null'
  independentDisclosure:
    anyOf:
      - type: string
      - type: 'null'
  isFeatured:
    type: boolean
required:
  - id
  - organizerId
  - title
  - slug
  - category
  - tagline
  - description
  - venueName
  - address
  - city
  - state
  - startsAt
  - endsAt
  - timezone
  - admissionType
  - photoKey
  - externalUrl
  - status
  - createdAt
