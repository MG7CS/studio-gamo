type: object
additionalProperties: false
properties:
  success:
    const: true
  data:
    type: object
    additionalProperties: false
    properties:
      truncated:
        type: boolean
      results:
        type: array
        maxItems: 10
        items:
          type: object
          additionalProperties: false
          properties:
            ticketId:
              type: string
            holderName:
              type: string
            emailMasked:
              type: string
            orderReference:
              type:
                - string
                - 'null'
            category:
              type:
                - string
                - 'null'
            section:
              type:
                - string
                - 'null'
            status:
              type: string
            inside:
              type: boolean
            entriesToday:
              type: integer
            legacy:
              type: boolean
          required:
            - ticketId
            - holderName
            - emailMasked
            - orderReference
            - category
            - section
            - status
            - inside
            - entriesToday
            - legacy
    required:
      - truncated
      - results
required:
  - success
  - data
