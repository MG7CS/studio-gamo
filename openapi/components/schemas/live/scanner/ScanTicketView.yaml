type: object
description: What a scanner may see about a ticket. Never an email, full name or order data.
additionalProperties: false
properties:
  holder:
    type: string
    description: First name and last initial only.
  category:
    type:
      - string
      - 'null'
  section:
    type:
      - string
      - 'null'
  zone:
    type:
      - string
      - 'null'
  seatsPerTicket:
    type: integer
    minimum: 1
required:
  - holder
  - category
  - section
  - zone
  - seatsPerTicket
