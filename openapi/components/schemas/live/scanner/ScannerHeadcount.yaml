type: object
additionalProperties: false
properties:
  dayKey:
    type: string
    pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
  insideNow:
    type: integer
    minimum: 0
  admittedToday:
    type: integer
    minimum: 0
  capacity:
    type: integer
    minimum: 0
required:
  - dayKey
  - insideNow
  - admittedToday
  - capacity
