type: object
additionalProperties: false
properties:
  eventId:
    $ref: ../../shared/Identifier.yaml
  scans:
    type: array
    minItems: 1
    maxItems: 200
    items:
      type: object
      additionalProperties: false
      properties:
        clientScanId:
          $ref: ./ClientScanId.yaml
        code:
          type: string
          minLength: 1
          maxLength: 200
        direction:
          type: string
          enum:
            - in
            - out
        deviceScannedAt:
          type: integer
          minimum: 0
          description: Device clock, epoch seconds.
        localResult:
          oneOf:
            - $ref: ./ScanResult.yaml
            - type: 'null'
      required:
        - clientScanId
        - code
        - direction
        - deviceScannedAt
required:
  - eventId
  - scans
