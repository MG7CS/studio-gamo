type: object
additionalProperties: false
properties:
  userId:
    $ref: ../shared/Identifier.yaml
  organizationId:
    $ref: ../shared/Identifier.yaml
  role:
    type: string
    enum:
      - event_owner
      - lead_promoter
      - host_venue
      - co_organizer
      - booking_agent
      - production_coordinator
      - ticketing_admin
      - finance_contact
      - door_scanner
  canEditContent:
    type: boolean
  canManageTicketing:
    type: boolean
  canApproveRefunds:
    type: boolean
  canViewSettlement:
    type: boolean
  canNegotiateBooking:
    type: boolean
  canCoordinateProduction:
    type: boolean
  canScanTickets:
    type: boolean
required:
  - userId
  - role
