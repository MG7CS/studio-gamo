type: object
additionalProperties: false
properties:
  success:
    const: true
  data:
    type: object
    additionalProperties: false
    properties:
      user:
        $ref: ../identity/User.yaml
      sessionId:
        type: string
      message:
        type: string
      next:
        type: string
        description: Same-site path to continue at (provider onboarding after a sign-up with a role).
        pattern: ^/account/
    required:
      - user
      - sessionId
      - message
required:
  - success
  - data
