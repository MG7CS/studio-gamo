type: object
additionalProperties: false
properties:
  success:
    const: true
  data:
    type: object
    additionalProperties: false
    properties:
      challengeId:
        $ref: ../shared/Identifier.yaml
      expiresAt:
        $ref: ../shared/Timestamp.yaml
      deliveryStatus:
        type: string
        enum:
          - sent
          - simulated
      message:
        type: string
    required:
      - challengeId
      - expiresAt
      - deliveryStatus
      - message
required:
  - success
  - data
