type: object
additionalProperties: false
properties:
  email:
    type: string
    format: email
    minLength: 3
    maxLength: 254
  code:
    type: string
    pattern: ^[0-9]{6}$
    minLength: 6
    maxLength: 6
  displayName:
    type: string
    minLength: 1
    maxLength: 120
  intent:
    type: string
    enum:
      - signin
      - signup
      - recover
  product:
    type: string
    enum:
      - web
      - worship
      - academy
      - live
      - production
  role:
    type: string
    description: Provider role chosen on the sign-up screen (sign-up only; must be one of this product's sign-up roles, otherwise ignored).
    enum:
      - musician
      - technician
      - church
      - agent
      - organizer
      - teacher
      - artist
  terms:
    type: array
    maxItems: 10
    description: Sign-up only — the terms documents the form showed (current Site Terms and Privacy Policy versions are required).
    items:
      $ref: ./TermsDocumentRef.yaml
  marketingOptIn:
    type: boolean
    description: Sign-up only — the separate, never pre-ticked marketing checkbox.
required:
  - email
  - code
