type: object
additionalProperties: false
properties:
  email:
    type: string
    format: email
    minLength: 3
    maxLength: 254
  code:
    type: string
    pattern: ^[0-9]{6}$
    minLength: 6
    maxLength: 6
  displayName:
    type: string
    minLength: 1
    maxLength: 120
  intent:
    type: string
    enum:
      - signin
      - signup
      - recover
  product:
    type: string
    enum:
      - web
      - worship
      - academy
      - live
      - production
required:
  - email
  - code
