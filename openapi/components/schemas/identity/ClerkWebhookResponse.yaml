type: object
additionalProperties: false
properties:
  success:
    const: true
  data:
    type: object
    additionalProperties: false
    properties:
      received:
        const: true
      status:
        type: string
        enum:
          - revoked
          - ignored
      sessionsRevoked:
        type: integer
        minimum: 0
    required:
      - received
      - status
      - sessionsRevoked
required:
  - success
  - data
