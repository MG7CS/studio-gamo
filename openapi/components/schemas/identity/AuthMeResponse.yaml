type: object
additionalProperties: false
properties:
  success:
    const: true
  data:
    type: object
    additionalProperties: false
    properties:
      user:
        $ref: ./User.yaml
      sessionId:
        type: string
      roles:
        type: array
        items:
          type: string
      memberships:
        type: array
        items:
          $ref: ./OrganizationMembershipSummary.yaml
      products:
        type: array
        items:
          type: string
      product:
        type:
          - string
          - "null"
    required:
      - user
      - sessionId
      - roles
      - memberships
required:
  - success
  - data
