type: object
additionalProperties: false
properties:
  email:
    type: string
    format: email
    minLength: 3
    maxLength: 254
  displayName:
    type: string
    minLength: 1
    maxLength: 120
  purpose:
    type: string
    enum:
      - login
    default: login
  intent:
    type: string
    enum:
      - signin
      - signup
      - recover
  product:
    type: string
    enum:
      - web
      - worship
      - academy
      - live
      - production
required:
  - email
