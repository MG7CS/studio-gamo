type: object
additionalProperties: false
properties:
  email:
    type: string
    format: email
    minLength: 3
    maxLength: 254
  displayName:
    type: string
    minLength: 1
    maxLength: 120
  purpose:
    type: string
    enum:
      - login
    default: login
  intent:
    type: string
    enum:
      - signin
      - signup
      - recover
  product:
    type: string
    enum:
      - web
      - worship
      - academy
      - live
      - production
  role:
    type: string
    description: Provider role chosen on the sign-up screen (sign-up only; must be one of this product's sign-up roles, otherwise ignored).
    enum:
      - musician
      - technician
      - church
      - agent
      - organizer
      - teacher
      - artist
  cf-turnstile-response:
    type: string
    maxLength: 4096
    description: Cloudflare Turnstile token (required outside ENVIRONMENT=local; local accepts the documented dummy token).
required:
  - email
